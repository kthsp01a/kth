name: KTHSP1 Inpaint Sandbox

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kthsp1-inpaint-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inpaint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare tools
        run: python -m pip install --disable-pip-version-check -q gdown pillow

      - name: Restore sandbox cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .kthsp1-inpaint-cache
          key: kthsp1-inpaint-sandbox-d157ce24-v1

      - name: Rehydrate runtime and inpaint model
        run: |
          set -euo pipefail
          mkdir -p .kthsp1-inpaint-cache/runtime .kthsp1-inpaint-cache/models result
          if [ ! -f .kthsp1-inpaint-cache/runtime.zip ]; then gdown 1snFA1p0B1yuJqsF_I2YJrFZTKqpCeKzv -O .kthsp1-inpaint-cache/runtime.zip; fi
          if ! find .kthsp1-inpaint-cache/runtime -type f -name sd-cli -print -quit | grep -q .; then unzip -q -o .kthsp1-inpaint-cache/runtime.zip -d .kthsp1-inpaint-cache/runtime; fi
          MODEL=.kthsp1-inpaint-cache/models/inpaint.gguf
          if [ ! -f "$MODEL" ]; then gdown 11QoQwVnTa3R_8bao0pbKZSwZQJBnW03d -O "$MODEL"; fi
          echo "d157ce24483f0c999062da140eacebe8f3ed015e652723e31f6d39119b800c16  $MODEL" | sha256sum -c -

      - name: Save sandbox cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .kthsp1-inpaint-cache
          key: kthsp1-inpaint-sandbox-d157ce24-v1

      - name: Prepare init image and center mask
        run: |
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/kthsp01a/kth/main/kthsp1-results/b4b54450-491d-44ae-a73a-15394c66ffe5/image.png" -o result/init.png
          python - <<'PY'
          from PIL import Image, ImageDraw
          img=Image.open('result/init.png').convert('RGB')
          if img.size!=(256,256): img=img.resize((256,256))
          img.save('result/init.png')
          mask=Image.new('L',(256,256),0)
          ImageDraw.Draw(mask).rectangle((64,64,191,191),fill=255)
          mask.save('result/mask.png')
          print('INIT_MASK_READY',img.size,mask.size)
          PY

      - name: Run inpaint
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          sd_cli=next(Path('.kthsp1-inpaint-cache/runtime').rglob('sd-cli'))
          sd_cli.chmod(0o755)
          env=os.environ.copy()
          env['LD_LIBRARY_PATH']=str(sd_cli.parent)+':'+env.get('LD_LIBRARY_PATH','')
          args=[str(sd_cli),'-m','.kthsp1-inpaint-cache/models/inpaint.gguf','--backend','cpu','--params-backend','disk','--vae-conv-direct','-p','preserve the concrete underpass, add a small patch of fresh green moss and tiny plants only in the center area, cinematic hand-painted 2D animation background','-n','people, animals, text, signs, logos, vehicles, distorted architecture, blurry, low quality','--cfg-scale','7.0','--steps','12','--seed','2026091703','-W','256','-H','256','--init-img','result/init.png','--mask','result/mask.png','--strength','0.65','-o','result/inpaint.png']
          proc=subprocess.run(args,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          Path('result/inpaint.log').write_text(proc.stdout,encoding='utf-8')
          print(proc.stdout)
          if proc.returncode!=0: raise SystemExit(proc.returncode)
          PY

      - name: Verify edited PNG
        run: |
          python - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          p=Path('result/inpaint.png')
          assert p.exists() and p.stat().st_size>0
          b=p.read_bytes()
          assert b[:8].hex()=='89504e470d0a1a0a'
          w,h=struct.unpack('>II',b[16:24])
          assert (w,h)==(256,256)
          manifest={'status':'TECH_QA_PASS','route_mode':'inpaint','model_sha256':'d157ce24483f0c999062da140eacebe8f3ed015e652723e31f6d39119b800c16','init_sha256':hashlib.sha256(Path('result/init.png').read_bytes()).hexdigest(),'mask_sha256':hashlib.sha256(Path('result/mask.png').read_bytes()).hexdigest(),'output_sha256':hashlib.sha256(b).hexdigest(),'width':w,'height':h,'image_gen_used':False}
          Path('result/manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Upload sandbox evidence
        uses: actions/upload-artifact@v4
        with:
          name: kthsp1-inpaint-sandbox
          path: |
            result/init.png
            result/mask.png
            result/inpaint.png
            result/inpaint.log
            result/manifest.json
          retention-days: 7
