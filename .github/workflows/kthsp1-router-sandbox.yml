name: KTHSP1 Router Sandbox

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kthsp1-router-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate router decisions
        run: |
          python - <<'PY'
          fixtures = [
              {"output_kind": "FINAL_PRODUCTION_ASSET", "expected": "txt2img"},
              {"output_kind": "SINGLE_KEYPOSE", "expected": "txt2img"},
              {"output_kind": "SINGLE_MOTION_FRAME", "expected": "txt2img"},
              {"output_kind": "EXISTING_ASSET_EDIT", "expected": "inpaint"},
          ]

          for item in fixtures:
              mode = "inpaint" if item["output_kind"] == "EXISTING_ASSET_EDIT" else "txt2img"
              assert mode == item["expected"], (item, mode)
              print(f'{item["output_kind"]} -> {mode}')

          print("ROUTER_SANDBOX_PASS")
          PY
